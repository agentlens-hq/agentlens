[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "runlens"
version = "0.1.3"
description = "Local agent trace capture and evidence-based failure diagnosis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  { name = "AgentLens", email = "hello@agentlens.run" }
]
keywords = ["ai", "agents", "observability", "debugging", "llm", "tracing", "anthropic", "openai", "langgraph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://agentlens.run"
Repository = "https://github.com/agentlens-hq/agentlens"
Documentation = "https://github.com/agentlens-hq/agentlens#readme"
"Bug Tracker" = "https://github.com/agentlens-hq/agentlens/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.107,<0.108"]
openai = ["openai>=2.41,<2.42"]
pii = ["spacy>=3.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["build", "ruff", "mypy", "httpx", "fastapi>=0.110", "langgraph>=0.6,<0.7"]

[project.scripts]
agentlens = "agentlens:main"

[tool.setuptools]
py-modules = ["agentlens"]
packages = ["agentlens_core", "agentlens_engine", "agentlens_sdk"]

[tool.setuptools.package-data]
agentlens_engine = ["corpus/positive/*.json", "corpus/healthy/*.json"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.9"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
