name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,anthropic,openai]"
      - name: Regression tests (local transports, no provider keys)
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: python -m ruff check agentlens.py agentlens_core agentlens_sdk agentlens_engine server/app.py tests
      - name: Types
        run: python -m mypy --no-incremental agentlens.py agentlens_core agentlens_sdk agentlens_engine
      - name: Local health and evidence evaluation
        run: |
          agentlens doctor
          agentlens evaluate
      - name: Example smoke tests
        run: |
          python examples/anthropic_broken_agent.py
          python examples/openai_broken_agent.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Install wheel outside checkout with no optional dependencies
        run: python tests/artifact_smoke.py dist/runlens-0.1.3-py3-none-any.whl

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: agentlens_sdk_ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agentlens_sdk_ts/package-lock.json
      - run: npm ci
      - run: npm test
